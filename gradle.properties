# 🌾 Item Farm Mod — Fabric 1.20.4

Craftea una **Granja de Items** que genera cualquier item al recibir una señal Redstone.

---

## 🔨 Receta de crafteo

```
[ Hierro  ]  [ Hierro   ]  [ Hierro ]
[ Hierro  ]  [ **ITEM** ]  [ Hierro ]
[ Hierro  ]  [ Redstone ]  [ Hierro ]
```

El **ITEM del centro** determina qué va a farmear la granja.  
Por ejemplo, pon un Diamante en el centro → obtienes una **Granja de Diamantes**.

---

## 🎮 Cómo usarla

| Acción | Resultado |
|--------|-----------|
| Craftear con ITEM en el centro | Granja preconfigurada para ese item |
| Colocar en el mundo | Se queda esperando señal |
| Dar señal Redstone (palanca, botón, etc.) | ¡Genera **8 unidades** del item encima! |
| Clic derecho con mano vacía | Muestra qué item farmea |
| Romper el bloque | Devuelve el item configurado |

> 💡 **Tip:** Conecta un reloj de Redstone para producción automática continua.

---

## ⚙️ Ajustar cantidad generada (NBT)

Por defecto genera **8 items** por pulso. Puedes cambiarlo con:

```
/give @p itemfarm:item_farm{TargetItem:{id:"minecraft:diamond",Count:1b},GenerateAmount:64}
```

---

## 🔧 Compilar e instalar

### Requisitos
- Java 21+ → https://adoptium.net/
- Fabric Loader 0.16.5+ → https://fabricmc.net/use/installer/
- Fabric API → https://modrinth.com/mod/fabric-api

### Compilar
```bash
# Windows
gradlew.bat build

# Mac / Linux
./gradlew build
```

El `.jar` se genera en `build/libs/item-farm-1.0.0.jar`

### Instalar
1. Copia `item-farm-1.0.0.jar` a tu carpeta `.minecraft/mods/`
2. Asegúrate de tener también **Fabric API** en la carpeta `mods/`
3. Lanza Minecraft **1.21.1** con el perfil Fabric

---

## 📁 Estructura del código

```
src/main/java/com/itemfarm/
├── ItemFarmMod.java                    ← Inicializador del mod
├── block/
│   ├── ItemFarmBlock.java              ← Bloque con lógica Redstone y clic derecho
│   └── ModBlocks.java                  ← Registro del bloque
├── blockentity/
│   ├── ItemFarmBlockEntity.java        ← Guarda el item objetivo, genera drops
│   └── ModBlockEntities.java           ← Registro del BlockEntity
└── recipe/
    └── FarmRecipe.java                 ← Receta dinámica personalizada
```

---

## 📝 Notas técnicas

- El mod funciona en **cliente y servidor** (`"environment": "*"`)
- La receta es **dinámica**: no está hardcodeada en JSON, sino en código Java mediante un `RecipeSerializer` personalizado, lo que permite aceptar cualquier item en el centro
- El item objetivo se guarda en el **NBT** del `BlockEntity`, por lo que persiste al guardar el mundo
- Al romper la granja con mano, se devuelve el item configurado para no perderlo
